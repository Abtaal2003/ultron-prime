name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra evals --extra otel --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests
        run: |
          set -o pipefail
          uv run pytest --cov 2>&1 | tee pytest.log
      - name: Surface test failures as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR)|Error|assert " pytest.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
      - name: Offline evals report
        run: uv run python -m evals.report --out /tmp/results.md
      - name: Dependency audit
        # The five chromadb advisories are all in Chroma's HTTP server (REST endpoints, RBAC,
        # remote model loading). This app uses the embedded PersistentClient and starts no
        # server, and no fixed version exists yet. Remove the ignores once a fix is released.
        run: |
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --group dev
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Generated types are current
        run: |
          npm run gen:types
          git diff --exit-code -- src/lib
        working-directory: web
        env:
          ULTRON_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npx vite build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End to end
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e.log
        working-directory: web
      - name: Surface e2e failures as annotations
        if: failure()
        run: grep -E "✘|Error|Timeout|expect" e2e.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
        working-directory: web
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ultron-prime:ci .
      - name: Start it the way compose does and wait for health
        run: |
          touch .env
          docker compose up -d
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q ultron)")
            [ "$state" = healthy ] && break
            sleep 2
          done
          docker compose logs ultron | tail -40
          [ "$state" = healthy ]
      - name: Health, web app and first-run passphrase
        run: |
          curl -fsS http://127.0.0.1:8787/api/v1/health
          curl -fsS http://127.0.0.1:8787/ | grep -qi '<div id="root"'
          docker compose logs ultron | grep -q "operator passphrase"
      - name: Doctor runs inside the image
        run: |
          docker compose exec -T ultron ultron doctor | tee doctor.txt || true
          grep -q "embeddings: local_light" doctor.txt
          grep -q "no model key set" doctor.txt
      - name: Local embeddings work from the baked-in model
        run: |
          docker compose exec -T -e HF_HUB_OFFLINE=1 ultron python -c "
          import asyncio
          from src.core.memory.embeddings import LocalEmbedder
          e = LocalEmbedder('sentence-transformers/all-MiniLM-L6-v2')
          v = asyncio.run(e.embed(['pytest, never unittest', 'I test with pytest']))
          print('dimension', len(v[0]), 'similarity', round(sum(a*b for a, b in zip(*v)), 3))
          assert len(v[0]) == 384
          "
      - name: Data survives a restart
        run: |
          docker compose restart ultron
          sleep 20
          curl -fsS http://127.0.0.1:8787/api/v1/health
          [ "$(docker compose logs ultron | grep -c 'operator passphrase')" = 1 ]
      - if: always()
        run: docker compose down -v
