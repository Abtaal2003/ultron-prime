[project]
name = "ultron-prime"
version = "1.0.0"
description = "Ultron Prime: a persona-driven, security-first autonomous agent with a FastAPI + React web terminal."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abtaal Aatif" }]
keywords = ["ai-agents", "llm-security", "prompt-injection", "fastapi", "langgraph", "agentic-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "anthropic>=1,<2",
  "groq>=1,<2",
  "google-genai>=2,<3",
  "chromadb>=1,<2",
  "fastapi>=0.130",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.20",
  "argon2-cffi>=23",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "aiosqlite>=0.20",
  "psutil>=6",
  "ddgs>=9",
  "structlog>=24",
  "python-dotenv>=1",
  "filetype>=1.2",
  "pypdf>=5",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1",
  "defusedxml>=0.7",
  "Pillow>=13",
  "reportlab>=4",
  "matplotlib>=3.9",
  "httpx>=0.27",
  "pyyaml>=6.0.3",
  "sse-starlette>=2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]
tavily = ["tavily-python>=0.5"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
evals = ["agentdojo>=0.1.35"]

[project.urls]
Repository = "https://github.com/Abtaal2003/ultron-prime"

[project.scripts]
ultron = "src.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3",
  "pip-audit>=2.7",
  "types-psutil",
  "types-reportlab",
  "httpx>=0.27",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "redteam", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "D", "ASYNC", "C4", "SIM", "RUF", "PT", "RET", "PIE", "C90"]
ignore = [
  "D203", "D213", "D107", "D105", "D104",
  "S101",   # asserts are fine in tests; src avoids them by convention
  "RUF001", "RUF002", "RUF003",
  # Single-operator app: short local filesystem calls inside async tools are acceptable, and
  # `timeout` parameters on helpers are explicit budgets, not asyncio.timeout misuse.
  "ASYNC230", "ASYNC240", "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "B", "RUF012", "SIM", "PT018", "PT011", "PT012", "E501", "RUF029", "ASYNC"]
"redteam/**" = ["S311"]
"evals/**" = ["S311"]
"evals/dojo/**" = ["B006", "B008", "D101", "D102", "S105"]
"web/**" = ["D"]

[tool.ruff.lint.mccabe]
# The CaMeL interpreter's node checker sits at 17; nothing should grow past it.
max-complexity = 17

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["src", "redteam", "evals"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "chromadb.*", "ddgs.*", "filetype.*", "pdfplumber.*", "pptx.*", "docx.*", "openpyxl.*",
  "reportlab.*", "matplotlib.*", "langgraph.*", "sentence_transformers.*", "agentdojo.*",
  "groq.*", "google.*", "mcp.*", "defusedxml.*", "tavily.*", "pypdfium2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["evals.dojo.*"]
disallow_subclassing_any = false  # AgentDojo ships no stubs; its base classes resolve to Any

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
  "slow: slower tests",
  "live: needs real provider keys, never run in CI",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src", "redteam", "evals"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]
