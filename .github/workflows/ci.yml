name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra evals --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests
        run: |
          set -o pipefail
          uv run pytest --cov 2>&1 | tee pytest.log
      - name: Surface test failures as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR)|Error|assert " pytest.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
      - name: Offline evals report
        run: uv run python -m evals.report --out /tmp/results.md
      - name: Dependency audit
        run: uv run pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --group dev
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Generated types are current
        run: |
          npm run gen:types
          git diff --exit-code -- src/lib
        working-directory: web
        env:
          ULTRON_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npx vite build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End to end
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e.log
        working-directory: web
      - name: Surface e2e failures as annotations
        if: failure()
        run: grep -E "✘|Error|Timeout|expect" e2e.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
        working-directory: web
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
