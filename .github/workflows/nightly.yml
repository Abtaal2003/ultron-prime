name: nightly-redteam
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: nightly-redteam

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REDTEAM_NIGHTLY_BUDGET_USD: "2.00"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra evals --group dev
      - name: Offline replay (always)
        run: uv run python -m redteam.run_nightly --offline
      - name: Live attack generation (stops at the spending cap)
        if: env.ANTHROPIC_API_KEY != '' || env.GEMINI_API_KEY != ''
        run: uv run python -m redteam.run_nightly --live
      - uses: actions/upload-artifact@v4
        with:
          name: redteam-runs
          path: data/redteam/runs/
